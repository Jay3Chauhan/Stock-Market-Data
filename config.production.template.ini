# NSE Scraper - Production Configuration Template
# Copy this file to config.production.ini and update values

[NSE]
# NSE India base URL
BASE_URL = https://www.nseindia.com

[DATABASE]
# ============================================
# MongoDB Atlas Connection (FREE TIER)
# ============================================
# Get your connection string from MongoDB Atlas:
# 1. Go to https://cloud.mongodb.com
# 2. Click "Connect" on your cluster
# 3. Choose "Connect your application"
# 4. Copy the connection string and replace <password>
# ============================================
MONGO_URI = mongodb+srv://YOUR_USERNAME:YOUR_PASSWORD@YOUR_CLUSTER.mongodb.net/?retryWrites=true&w=majority

# Database names
MONGO_DB = NSE_SCRAPER
MONGO_DB_MASTER = GETMASTERDATA

# ============================================
# SQL Server (OPTIONAL - Disable for free tier)
# ============================================
SQL_SERVER_ENABLED = false
SQL_SERVER_HOST = 
SQL_SERVER_PORT = 1433
SQL_SERVER_DATABASE = 
SQL_SERVER_USERNAME = 
SQL_SERVER_PASSWORD = 

[SCRAPING]
# ============================================
# Scraping Configuration
# ============================================
# Data collection interval in minutes (during market hours)
# Recommended: 5-10 for production, 1 for testing
DATA_COLLECTION_INTERVAL = 5

# HTTP request timeout in seconds
TIMEOUT = 30

# Cookie refresh interval in minutes
COOKIE_REFRESH_INTERVAL = 60

# Maximum retry attempts for failed requests
MAX_RETRIES = 3

# Retry delay in seconds (exponential backoff)
RETRY_DELAY = 2

[SERVER]
# ============================================
# FastAPI Server Configuration
# ============================================
HOST = 0.0.0.0
PORT = 1020
DEBUG = false

# Workers (for production with uvicorn)
WORKERS = 2

[LOGGING]
# ============================================
# Logging Configuration
# ============================================
# Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
LOG_LEVEL = INFO

# Log file rotation
MAX_LOG_SIZE_MB = 50
BACKUP_COUNT = 5

[CRON]
# ============================================
# Cron Job Intervals (in minutes)
# ============================================
# Market data jobs (only run during market hours)
GAINERS_LOSERS = 7
WEEK_52_DATA = 8
MOST_ACTIVE_CONTRACTS = 7
ADVANCES_DECLINES = 7
MOST_ACTIVE_EQUITIES = 7
INDICES_DATA = 7
LARGE_DEALS = 8
PRICE_BAND_HITTERS = 7
MOST_ACTIVE_UNDERLYING = 7
NEW_LISTINGS = 8
RECENT_LISTINGS = 8
FORTHCOMING_LISTINGS = 8
SPECIAL_PREOPEN = 8

# Always-running jobs
IPO_DATA = 360
ZERODHA_MATCHING = 360
COOKIE_REFRESH = 4

[MARKET_HOURS]
# ============================================
# NSE Market Hours (IST)
# ============================================
OPEN_HOUR = 9
OPEN_MINUTE = 15
CLOSE_HOUR = 15
CLOSE_MINUTE = 30

# Pre-market session
PRE_MARKET_OPEN_HOUR = 9
PRE_MARKET_OPEN_MINUTE = 0

[EXTERNAL_APIS]
# ============================================
# External API Configuration
# ============================================
# InvestorGain API for IPO data
INVESTORGAIN_API_URL = https://webnodejs.investorgain.com

# Zerodha IPO API
ZERODHA_IPO_URL = https://zerodha.com/ipo/

[PATHS]
# ============================================
# File Paths (relative to project root)
# ============================================
LOGS_DIR = Logs
OUTPUT_DIR = output
IPO_DATA_DIR = ipo_data
COOKIES_FILE = nse_cookies.json
