# NSE Scraper - Lightweight Docker Compose for Micro VMs
# For Oracle E2.Micro (1 OCPU, 1GB RAM) or similar small VMs
# Uses lighter approach WITHOUT Chrome/Selenium

services:
  nse-scraper:
    container_name: nse-scraper
    build:
      context: .
      dockerfile: Dockerfile.lite
    restart: unless-stopped
    
    environment:
      - TZ=Asia/Kolkata
      - PYTHONUNBUFFERED=1
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017}
      - MONGO_DB=${MONGO_DB:-NSE_SCRAPER}
      - MONGO_DB_MASTER=${MONGO_DB_MASTER:-GETMASTERDATA}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=1020
      - DEBUG=false
      - DATA_COLLECTION_INTERVAL=${DATA_COLLECTION_INTERVAL:-5}
      - COOKIE_REFRESH_INTERVAL=${COOKIE_REFRESH_INTERVAL:-60}
      # Disable Chrome-based cookie fetching on low-memory VMs
      - USE_SELENIUM=false
    
    ports:
      - "1020:1020"
    
    volumes:
      - ./Logs:/app/Logs
      - ./output:/app/output
      - ./ipo_data:/app/ipo_data
      - ./config.ini:/app/config.ini:ro
      # NSE cookies cache (auto-managed by the server)
      - ./nse_cookies.json:/app/nse_cookies.json
    
    # Minimal resource limits for 1GB RAM VM
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 800M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1020/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: nse-network
    driver: bridge
